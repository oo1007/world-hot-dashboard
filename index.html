<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>个人工作台｜日常操作台</title><style>
:root{--bg:#f3f1eb;--paper:#fffdfa;--ink:#17211d;--muted:#68736c;--green:#174c3c;--line:#dedbd2;--blue:#2563eb}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 system-ui,-apple-system,"Microsoft YaHei",sans-serif}.shell{max-width:1000px;margin:auto;padding:28px 20px 70px}header{display:flex;justify-content:space-between;gap:18px;align-items:flex-start;border-bottom:1px solid var(--line);padding-bottom:22px}h1{margin:0;font-size:clamp(30px,5vw,48px);letter-spacing:-.04em}.sub{color:var(--muted);margin:7px 0 0}.nav{display:flex;gap:8px;flex-wrap:wrap}.nav a{padding:8px 12px;border:1px solid var(--line);border-radius:999px;color:var(--ink);text-decoration:none;font-size:13px;font-weight:700;background:var(--paper)}.nav a.primary{background:var(--green);border-color:var(--green);color:#fff}.grid{display:grid;grid-template-columns:1.2fr .8fr;gap:16px;margin-top:22px}.card{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:0 8px 24px #15392c0d}h2{font-size:20px;margin:0 0 12px}.hint{margin:0 0 16px;color:var(--muted);font-size:13px}.form{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:11px}.field{display:flex;flex-direction:column;gap:5px}.wide{grid-column:1/-1}.field label{font-size:12px;color:var(--muted);font-weight:750}input,select,textarea,button{border:1px solid #cfd6d1;border-radius:9px;padding:10px;background:#fff;color:var(--ink);font:inherit}textarea{resize:vertical}button{border:0;background:var(--green);color:#fff;font-weight:750;cursor:pointer}button:disabled{opacity:.55}.status{min-height:22px;font-size:13px;margin-top:10px}.legend{display:grid;gap:9px}.legend div{display:flex;align-items:center;gap:9px}.dot{width:11px;height:11px;border-radius:50%;display:inline-block}.blue{background:#3b82f6}.lime{background:#22c55e}.orange{background:#f97316}.purple{background:#8b5cf6}.yellow{background:#eab308}.notice{margin-top:16px;padding:13px;background:#eff6ff;border-left:3px solid var(--blue);border-radius:0 9px 9px 0;font-size:13px}.brief{margin-top:16px;background:linear-gradient(130deg,#152f45,#285c76);color:#fff}.brief p{color:#d3e0e9}.brief a{display:inline-block;margin-top:4px;padding:9px 13px;border-radius:9px;background:#fff;color:#173a55;text-decoration:none;font-weight:800}@media(max-width:760px){header,.grid{display:block}.nav{margin-top:15px}.grid>*,.brief{margin-bottom:16px}.form{grid-template-columns:1fr}.wide{grid-column:auto}}
</style></head><body><main class="shell"><header><div><h1>日常操作台</h1><p class="sub" id="todayLabel">今天 · Asia/Shanghai</p></div><nav><a class="primary" href="./">日常操作台</a><a href="brief.html">今日简报 →</a></nav></header><div class="grid"><section class="card"><h2>新增今天的行动</h2><p class="hint">这是固定功能区。无论你何时打开，默认都会填入今天；你也可自行改成未来任意日期和时间。</p><form id="actionForm" class="form"><div class="field wide"><label>行动标题</label><input id="actionTitle" required maxlength="80" placeholder="例如：完成项目复盘"></div><div class="field"><label>开始时间</label><input id="actionStart" type="datetime-local" required></div><div class="field"><label>结束时间</label><input id="actionEnd" type="datetime-local" required></div><div class="field"><label>分类</label><select id="actionCategory"><option value="工作">工作</option><option value="健身">健身</option><option value="吃饭">吃饭</option><option value="娱乐">娱乐</option><option value="学习">学习</option></select></div><div class="field wide"><label>备注（可选）</label><textarea id="actionNote" rows="2" placeholder="目标、完成标准或地点"></textarea></div><button class="wide" id="syncBtn">同步到飞书日历</button></form><div id="status" class="status" role="status" aria-live="polite"></div><div class="notice">同步只在你点击按钮后发生；同一天同名事项会阻止重复创建。</div></section><aside class="card"><h2>分类与日历颜色</h2><div class="legend"><div><i class="dot blue"></i>工作</div><div><i class="dot lime"></i>健身</div><div><i class="dot orange"></i>吃饭</div><div><i class="dot purple"></i>娱乐</div><div><i class="dot yellow"></i>学习</div></div><p class="hint" style="margin-top:18px">日程标题保持你输入的原文，不再显示“[工作台]”。</p></aside></div><section class="card brief"><h2>每日资讯简报</h2><p>新闻、汇率、英语视频和英语积累每天更新；它与日常操作台分开归档，不会影响你今天新增日程。</p><a href="brief.html">打开今日简报 →</a></section></main><script>
const parts=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Shanghai',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date()),val=t=>parts.find(x=>x.type===t).value,today=`${val('year')}-${val('month')}-${val('day')}`;todayLabel.textContent=`${today} · Asia/Shanghai`;const local=t=>`${today}T${t}`,iso=s=>`${s}:00+08:00`;actionStart.value=local('09:00');actionEnd.value=local('09:30');actionForm.addEventListener('submit',async e=>{e.preventDefault();const p={title:actionTitle.value.trim(),start:iso(actionStart.value),end:iso(actionEnd.value),category:actionCategory.value,note:actionNote.value.trim()};if(p.end<=p.start){status.textContent='结束时间必须晚于开始时间。';return}syncBtn.disabled=true;status.textContent='正在同步到飞书日历…';try{const r=await fetch('http://127.0.0.1:8765/events',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(p)}),data=await r.json();if(!r.ok||!data.ok)throw Error(data.message||'同步失败');status.textContent='✓ '+data.message;actionTitle.value='';actionNote.value=''}catch(err){status.textContent='同步失败：'+err.message+'。请确认本机同步服务正在运行。'}finally{syncBtn.disabled=false}});
</script></body></html>
