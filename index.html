<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>我的工作台</title><style>:root{--bg:#f4f2ec;--paper:#fffefa;--ink:#17211d;--muted:#66716b;--green:#174c3c;--line:#dedbd2}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 system-ui,-apple-system,"Microsoft YaHei"}.w{max-width:1120px;margin:auto;padding:26px 18px 60px}header{display:flex;justify-content:space-between;gap:20px;align-items:end;padding:22px 0;border-bottom:1px solid var(--line)}h1,h2,h3{margin:0 0 9px}.sub{color:var(--muted);margin:4px 0}.nav a{color:var(--green);font-weight:700;margin-left:16px}.sec{margin-top:26px}.grid{display:grid;grid-template-columns:1.35fr .65fr;gap:16px}.card{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:0 8px 24px #15392c0d}.form{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:10px}.field{display:flex;flex-direction:column;gap:4px}.wide{grid-column:1/-1}label{font-size:12px;color:var(--muted);font-weight:750}input,select,textarea,button{padding:10px;border-radius:9px;border:1px solid #ced6cf;background:#fff;font:inherit}button{background:var(--green);color:#fff;border:0;font-weight:800;cursor:pointer}.secondary{background:#edf4ef;color:#174c3c;border:1px solid #bbd2c0}.voice{display:flex;gap:8px;align-items:end}.voice textarea{flex:1}.preview{margin-top:10px;padding:11px;background:#f2f7f4;border-radius:9px;font-size:13px}.status{min-height:22px;margin-top:10px;font-size:13px}.legend{display:grid;gap:8px}.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px}.work{background:#3b82f6}.sport{background:#22c55e}.meal{background:#f97316}.fun{background:#8b5cf6}.study{background:#eab308}.daily{margin-top:16px}.daily iframe{display:block;width:100%;height:1050px;border:0;border-radius:12px}@media(max-width:760px){header,.grid{display:block}.nav{margin-top:12px}.nav a{margin:0 12px 0 0}.grid .card{margin-bottom:14px}.form{grid-template-columns:1fr}.wide{grid-column:auto}.voice{display:block}.voice button{margin-top:8px}.daily iframe{height:1250px}}</style><body><main class="w"><header><div><h1>我的工作台</h1><p class="sub" id="date">每天使用、持续扩展</p></div><div class="nav"><a href="#workspace">工作与记录</a><a href="#daily">今日资讯与英语</a></div></header><section id="workspace" class="sec"><h2>工作与记录</h2><p class="sub">固定模块 · 说一句话，确认后同步飞书日历</p><div class="grid"><section class="card"><h3>口述添加行动</h3><div class="voice"><textarea id="natural" rows="3" placeholder="例如：明天下午三点健身一小时；今天晚上七点和朋友吃饭；周五十点改简历两小时"></textarea><button class="secondary" id="mic" type="button">🎙 开始说话</button><button id="parse" type="button">解析行动</button></div><div class="preview" id="preview">支持：今天 / 明天 / 后天 / 周几、上午 / 下午 / 晚上、3点 / 3点半、持续 1 小时，以及工作、健身、吃饭、娱乐、学习。</div><hr style="border:0;border-top:1px solid #dedbd2;margin:18px 0"><form class="form" id="f"><div class="field wide"><label>事项</label><input id="t" required maxlength="80"></div><div class="field"><label>开始</label><input id="s" type="datetime-local" required></div><div class="field"><label>结束</label><input id="e" type="datetime-local" required></div><div class="field"><label>分类</label><select id="c"><option>工作</option><option>健身</option><option>吃饭</option><option>娱乐</option><option>学习</option></select></div><div class="field wide"><label>备注</label><textarea id="n" rows="2"></textarea></div><button class="wide" id="b">确认并同步飞书日历</button></form><div class="status" id="msg" role="status"></div></section><aside class="card"><h3>分类与日历颜色</h3><div class="legend"><div><i class="dot work"></i>工作</div><div><i class="dot sport"></i>健身</div><div><i class="dot meal"></i>吃饭</div><div><i class="dot fun"></i>娱乐</div><div><i class="dot study"></i>学习</div></div><p class="sub" style="margin-top:18px">语音仅在浏览器中转文字；页面不会自动建日程，仍需你点击确认。</p></aside></div></section><section id="daily" class="sec daily"><h2>今日资讯与英语</h2><p class="sub">每日自动更新 · 历史另存</p><iframe title="今日资讯、汇率与英语" src="brief.html"></iframe></section></main><script>const ps=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Shanghai',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date()),v=x=>ps.find(i=>i.type===x).value,today=`${v('year')}-${v('month')}-${v('day')}`,iso=x=>`${x}:00+08:00`;date.textContent=`${today} · Asia/Shanghai · 每天使用、持续扩展`;s.value=`${today}T09:00`;e.value=`${today}T09:30`;const pad=x=>String(x).padStart(2,'0'),fmt=x=>`${x.getFullYear()}-${pad(x.getMonth()+1)}-${pad(x.getDate())}`,cat=x=>/健身|运动|跑步|瑜伽/.test(x)?'健身':/吃饭|晚餐|午餐|早餐|饭/.test(x)?'吃饭':/娱乐|电影|游戏|追剧|聚会/.test(x)?'娱乐':/学习|英语|复习|看书|课程/.test(x)?'学习':'工作';function parseText(){let x=natural.value.trim();if(!x)return;let d=new Date(`${today}T00:00:00+08:00`),m=x.match(/(\d{1,2})点(半|\d{1,2}分)?/),hour=m?+m[1]:9,min=m&&m[2]==='半'?30:0;if(/明天/.test(x))d.setDate(d.getDate()+1);if(/后天/.test(x))d.setDate(d.getDate()+2);let ws={'周一':1,'周二':2,'周三':3,'周四':4,'周五':5,'周六':6,'周日':0,'星期一':1,'星期二':2,'星期三':3,'星期四':4,'星期五':5,'星期六':6,'星期日':0};for(let k in ws)if(x.includes(k)){let n=(ws[k]-d.getDay()+7)%7||7;d.setDate(d.getDate()+n)}if(/下午|晚上|傍晚/.test(x)&&hour<12)hour+=12;if(/中午/.test(x)&&hour<11)hour+=12;let dur=(x.match(/(\d+(?:\.5)?)\s*(?:个)?小时/)||[,1])[1]*60;t.value=x.replace(/今天|明天|后天|周[一二三四五六日]|星期[一二三四五六日]|上午|下午|晚上|傍晚|中午|\d{1,2}点(?:半|\d{1,2}分)?|持续|\d+(?:\.5)?\s*(?:个)?小时/g,'').replace(/[，。；;]/g,'').trim()||'未命名行动';c.value=cat(x);s.value=`${fmt(d)}T${pad(hour)}:${pad(min)}`;let end=new Date(d);end.setHours(hour,min+dur);e.value=`${fmt(end)}T${pad(end.getHours())}:${pad(end.getMinutes())}`;n.value=`原始表述：${x}`;preview.textContent=`已解析：${fmt(d)} ${pad(hour)}:${pad(min)} · ${t.value} · ${c.value} · ${dur}分钟。请检查后确认同步。`}parse.onclick=parseText;let R=window.SpeechRecognition||window.webkitSpeechRecognition;if(R){let r=new R();r.lang='zh-CN';r.continuous=false;r.onresult=e=>{natural.value=e.results[0][0].transcript;parseText()};r.onerror=()=>preview.textContent='语音识别未成功；可直接输入自然语言。';mic.onclick=()=>r.start()}else{mic.disabled=true;mic.textContent='浏览器不支持语音'}f.onsubmit=async x=>{x.preventDefault();let q={title:t.value.trim(),start:iso(s.value),end:iso(e.value),category:c.value,note:n.value.trim()};if(q.end<=q.start){msg.textContent='结束时间必须晚于开始时间。';return}b.disabled=true;msg.textContent='正在同步…';try{let r=await fetch('http://127.0.0.1:8765/events',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(q)}),j=await r.json();if(!r.ok||!j.ok)throw Error(j.message||'同步失败');msg.textContent='✓ '+j.message;t.value='';n.value=''}catch(err){msg.textContent='同步失败：'+err.message}finally{b.disabled=false}};</script></body></html>
