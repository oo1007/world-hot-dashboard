<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>个人工作台</title>
  <style>
    :root{--ink:#17211d;--muted:#647069;--green:#174c3c;--paper:#fffdfa;--line:#dedbd2;--bg:#f3f1eb}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 system-ui,-apple-system,"Microsoft YaHei",sans-serif}.bar{position:sticky;top:0;z-index:2;padding:16px max(4vw,18px);background:#fffdfaf2;border-bottom:1px solid var(--line);backdrop-filter:blur(10px)}.bar-in{max-width:1180px;margin:auto;display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center}.brand b{display:block;font-size:18px}.brand span{color:var(--muted);font-size:12px}.form{display:grid;grid-template-columns:1.4fr 1fr 1fr .8fr 1.1fr auto;gap:8px;align-items:end}.field{display:flex;flex-direction:column;gap:3px}.field label{font-size:11px;color:var(--muted);font-weight:700}input,select,button{min-height:38px;border:1px solid #cfd6d1;border-radius:8px;background:#fff;padding:8px;font:inherit}button{border:0;background:var(--green);color:#fff;font-weight:700;cursor:pointer}.status{grid-column:2/-1;min-height:18px;color:var(--muted);font-size:12px}iframe{display:block;width:100%;height:calc(100vh - 113px);border:0;background:var(--bg)}@media(max-width:900px){.bar-in{grid-template-columns:1fr}.form{grid-template-columns:1fr 1fr}.field:first-child{grid-column:1/-1}.status{grid-column:1/-1}iframe{height:calc(100vh - 300px)}}
  </style>
</head>
<body>
  <section class="bar" aria-label="今日行动区"><div class="bar-in"><div class="brand"><b>今日行动区</b><span>填写后才同步到飞书日历</span></div><form class="form" id="actionForm"><div class="field"><label>行动标题</label><input id="title" required maxlength="80" placeholder="例如：完成项目复盘"></div><div class="field"><label>开始</label><input id="start" type="datetime-local" required></div><div class="field"><label>结束</label><input id="end" type="datetime-local" required></div><div class="field"><label>分类</label><select id="category"><option>工作</option><option>健身</option><option>吃饭</option><option>娱乐</option><option>学习</option></select></div><div class="field"><label>备注（可选）</label><input id="note" placeholder="目标或完成标准"></div><button id="submit">同步飞书</button><div id="status" class="status" role="status" aria-live="polite">同日同名行动会阻止重复；日历中将显示所选分类颜色。</div></form></div></section>
  <iframe id="dashboard" title="8月18日个人工作台" src="world_hot_dashboard_2026-08-18.html"></iframe>
  <script>
    const pad=n=>String(n).padStart(2,'0'),local=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`,toIso=s=>`${s}:00+08:00`;
    const now=new Date(),startAt=new Date(Math.ceil(now.getTime()/1800000)*1800000);start.value=local(startAt);end.value=local(new Date(startAt.getTime()+1800000));
    dashboard.addEventListener('load',()=>{try{const doc=dashboard.contentDocument;const old=doc.querySelector('.layout > div > section.card');if(old&&old.querySelector('#actionForm'))old.remove();dashboard.style.height=Math.max(800,doc.documentElement.scrollHeight+16)+'px'}catch(_){}});
    actionForm.addEventListener('submit',async e=>{e.preventDefault();const p={title:title.value.trim(),start:toIso(start.value),end:toIso(end.value),category:category.value,note:note.value.trim()};if(p.end<=p.start){status.textContent='结束时间必须晚于开始时间。';return}submit.disabled=true;status.textContent='正在同步…';try{const r=await fetch('http://127.0.0.1:8765/events',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(p)});const data=await r.json();if(!r.ok||!data.ok)throw Error(data.message||'同步失败');status.textContent='✓ '+data.message;title.value='';note.value=''}catch(err){status.textContent='同步失败：'+err.message+'。请确认本机同步服务正在运行。'}finally{submit.disabled=false}});
  </script>
</body>
</html>
