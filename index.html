<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>我的工作台</title>
<style>:root{--bg:#f4f2ec;--paper:#fffefa;--ink:#17211d;--muted:#66716b;--green:#174c3c;--line:#dedbd2;--warn:#9a3412}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 system-ui,-apple-system,"Microsoft YaHei"}.w{max-width:1120px;margin:auto;padding:26px 18px 60px}header{display:flex;justify-content:space-between;gap:20px;align-items:end;padding:22px 0;border-bottom:1px solid var(--line)}h1,h2,h3{margin:0 0 9px}.sub,.hint{color:var(--muted);margin:4px 0}.hint{font-size:12px}.nav a{color:var(--green);font-weight:700;margin-left:16px}.sec{margin-top:26px}.grid{display:grid;grid-template-columns:1.35fr .65fr;gap:16px}.card{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:0 8px 24px #15392c0d}.form{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:10px}.field{display:flex;flex-direction:column;gap:4px}.wide{grid-column:1/-1}label{font-size:12px;color:var(--muted);font-weight:750}input,select,textarea,button{padding:10px;border-radius:9px;border:1px solid #ced6cf;background:#fff;font:inherit}button{background:var(--green);color:#fff;border:0;font-weight:800;cursor:pointer}.secondary{background:#edf4ef;color:#174c3c;border:1px solid #bbd2c0}.voice{display:flex;gap:8px;align-items:end}.voice textarea{flex:1}.preview{margin-top:10px;padding:11px;background:#f2f7f4;border-radius:9px;font-size:13px}.preview.warn{background:#fff3e8;color:var(--warn)}.status{min-height:22px;margin-top:10px;font-size:13px}.legend{display:grid;gap:8px}.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px}.work{background:#3b82f6}.sport{background:#22c55e}.meal{background:#f97316}.fun{background:#8b5cf6}.study{background:#eab308}.daily{margin-top:16px}.daily iframe{display:block;width:100%;height:1050px;border:0;border-radius:12px}@media(max-width:760px){header,.grid{display:block}.nav{margin-top:12px}.nav a{margin:0 12px 0 0}.grid .card{margin-bottom:14px}.form{grid-template-columns:1fr}.wide{grid-column:auto}.voice{display:block}.voice button{margin-top:8px}.daily iframe{height:1250px}}</style></head>
<body><main class="w"><header><div><h1>我的工作台</h1><p class="sub" id="date">每天使用、持续扩展</p></div><div class="nav"><a href="#workspace">工作与记录</a><a href="#daily">今日资讯与英语</a></div></header>
<section id="workspace" class="sec"><h2>工作与记录</h2><p class="sub">固定模块 · 说一句话，核对后同步飞书日历</p><div class="grid"><section class="card"><h3>口述添加行动</h3><div class="voice"><textarea id="natural" rows="3" placeholder="例如：明天下午三点健身一小时；下周五晚上七点和朋友吃饭；今天十点到十一点半改简历"></textarea><button class="secondary" id="mic" type="button">🎙 开始说话</button><button id="parse" type="button">解析行动</button></div><p class="hint">支持：具体日期、今天/明天/后天、这周/下周周几、时间范围（3点到4点半）和时长（一个半小时）。</p><div class="preview" id="preview">先说出“什么时候、做什么、多久/到几点”。系统不会自动创建日程。</div><hr style="border:0;border-top:1px solid #dedbd2;margin:18px 0"><form class="form" id="f"><div class="field wide"><label>事项</label><input id="t" required maxlength="80"></div><div class="field"><label>开始</label><input id="s" type="datetime-local" required></div><div class="field"><label>结束</label><input id="e" type="datetime-local" required></div><div class="field"><label>分类</label><select id="c"><option>工作</option><option>健身</option><option>吃饭</option><option>娱乐</option><option>学习</option></select></div><div class="field wide"><label>备注</label><textarea id="n" rows="2"></textarea></div><button class="wide" id="b">确认并同步飞书日历</button></form><div class="status" id="msg" role="status"></div></section><aside class="card"><h3>分类与日历颜色</h3><div class="legend"><div><i class="dot work"></i>工作</div><div><i class="dot sport"></i>健身</div><div><i class="dot meal"></i>吃饭</div><div><i class="dot fun"></i>娱乐</div><div><i class="dot study"></i>学习</div></div><p class="sub" style="margin-top:18px">语音只在浏览器中转为文字；日期、时间和事项始终可手动修正。</p></aside></div></section>
<section id="daily" class="sec daily"><h2>今日资讯与英语</h2><p class="sub">每日自动更新 · 历史另存</p><iframe title="今日资讯、汇率与英语" src="brief.html"></iframe></section></main>
<script>
const parts=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Shanghai',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date()),$=id=>document.getElementById(id),pad=n=>String(n).padStart(2,'0'),val=k=>parts.find(x=>x.type===k).value,today=`${val("year")}-${val("month")}-${val("day")}`,iso=x=>`${x}:00+08:00`;
const dateKey=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;$('date').textContent=`${today} · Asia/Shanghai · 每天使用、持续扩展`;$('s').value=`${today}T09:00`;$('e').value=`${today}T09:30`;
const cn={零:0,一:1,二:2,三:3,四:4,五:5,六:6,七:7,八:8,九:9,十:10,两:2};function num(z){if(/^\d+$/.test(z))return+z;if(z==='半')return .5;if(z.length===1)return cn[z];if(z==='十')return 10;if(z[0]==='十')return 10+cn[z[1]];if(z[1]==='十')return cn[z[0]]*10+(cn[z[2]]||0);return NaN}function category(x){return /健身|运动|跑步|瑜伽|游泳|训练/.test(x)?'健身':/吃饭|晚餐|午餐|早餐|下午茶|聚餐|饭/.test(x)?'吃饭':/娱乐|电影|游戏|追剧|聚会|演唱会/.test(x)?'娱乐':/学习|英语|复习|看书|课程|背单词|上课/.test(x)?'学习':'工作'}
function dateFrom(x){let d=new Date(`${today}T00:00:00+08:00`),m=x.match(/(\d{4})[年\/-](\d{1,2})月?[\/-](\d{1,2})日?/);if(m)return new Date(+m[1],+m[2]-1,+m[3]);m=x.match(/(\d{1,2})月(\d{1,2})日?/);if(m){d=new Date(d.getFullYear(),+m[1]-1,+m[2]);if(d<new Date(`${today}T00:00:00+08:00`))d.setFullYear(d.getFullYear()+1);return d}if(/大后天/.test(x))d.setDate(d.getDate()+3);else if(/后天/.test(x))d.setDate(d.getDate()+2);else if(/明天/.test(x))d.setDate(d.getDate()+1);let w=x.match(/(下周|这周|本周)?(?:星期|周)([一二三四五六日天])/);if(w){let target={一:1,二:2,三:3,四:4,五:5,六:6,日:0,天:0}[w[2]],delta=(target-d.getDay()+7)%7;if(w[1]==='下周')delta+=7;else if(!w[1]&&delta===0)delta=7;d.setDate(d.getDate()+delta)}return d}
function times(x){let mer=(x.match(/上午|下午|晚上|傍晚|中午|凌晨|早上|早晨/g)||[]).join(' ');return[...x.matchAll(/([0-9一二三四五六七八九十两]+)点(?:(半)|([0-9一二三四五六七八九十两]+)分?)?/g)].map(m=>{let h=num(m[1]),mi=m[2]?30:(m[3]?num(m[3]):0);if(/下午|晚上|傍晚/.test(mer)&&h<12)h+=12;if(/中午/.test(mer)&&h<11)h+=12;if(/凌晨/.test(mer)&&h===12)h=0;return Number.isFinite(h)&&Number.isFinite(mi)&&h<25&&mi<60?{h,mi}:null}).filter(Boolean)}
function duration(x){let m=x.match(/([0-9一二三四五六七八九十两]+)(?:个)?小时(?:([0-9一二三四五六七八九十两]+)分|半)?/);if(m)return Math.round((num(m[1])+(m[2]?num(m[2]):(/半/.test(m[0])?.5:0)))*60);m=x.match(/([0-9一二三四五六七八九十两]+)分钟/);return m?num(m[1]):30}
function titleOf(x){return x.replace(/\d{4}[年\/-]\d{1,2}月?[\/-]\d{1,2}日?|\d{1,2}月\d{1,2}日?|今天|明天|后天|大后天|下周|这周|本周|星期[一二三四五六日天]|周[一二三四五六日天]|上午|下午|晚上|傍晚|中午|凌晨|早上|早晨|从|到|至|持续|时长|大约|差不多|安排|帮我|我要|我想|[0-9一二三四五六七八九十两]+点(?:(?:半)|(?:[0-9一二三四五六七八九十两]+分?))?|[0-9一二三四五六七八九十两]+(?:个)?小时(?:半|[0-9一二三四五六七八九十两]+分)?|[0-9一二三四五六七八九十两]+分钟/g,'').replace(/[，,。；;、]+/g,' ').replace(/\s+/g,' ').trim()}
function preview(lines,warn){let p=$('preview');p.className='preview'+(warn?' warn':'');p.innerHTML=lines.join('<br>')}function parseText(){let x=$('natural').value.trim();if(!x)return preview(['请先输入或说出行动。'],true);let d=dateFrom(x),ts=times(x),warnings=[],a=ts[0]||{h:9,mi:0};if(!ts.length)warnings.push('没有识别到时间，暂设为 09:00；请手动修改。');let start=new Date(d.getFullYear(),d.getMonth(),d.getDate(),a.h,a.mi),end;if(ts[1]){end=new Date(d.getFullYear(),d.getMonth(),d.getDate(),ts[1].h,ts[1].mi);if(end<=start)end.setDate(end.getDate()+1)}else end=new Date(start.getTime()+duration(x)*60000);let title=titleOf(x);if(!title){title='未命名行动';warnings.push('没有识别到事项，请填写事项名称。')}$('t').value=title;$('c').value=category(x);$('s').value=`${dateKey(start)}T${pad(start.getHours())}:${pad(start.getMinutes())}`;$('e').value=`${dateKey(end)}T${pad(end.getHours())}:${pad(end.getMinutes())}`;$('n').value='原始表述：'+x;preview([`已解析：${dateKey(start)} ${pad(start.getHours())}:${pad(start.getMinutes())}–${dateKey(end)} ${pad(end.getHours())}:${pad(end.getMinutes())} · ${title} · ${$("c").value}`,...warnings.map(z=>'⚠ '+z),'请核对下方字段，再确认同步。'],warnings.length)}
$('parse').onclick=parseText;let R=window.SpeechRecognition||window.webkitSpeechRecognition;if(R){let r=new R();r.lang='zh-CN';r.continuous=false;r.onresult=e=>{$('natural').value=e.results[0][0].transcript;parseText()};r.onerror=()=>preview(['语音识别未成功；可直接输入。'],true);$('mic').onclick=()=>r.start()}else{$('mic').disabled=true;$('mic').textContent='浏览器不支持语音'}$('f').onsubmit=async e=>{e.preventDefault();let q={title:$('t').value.trim(),start:iso($('s').value),end:iso($('e').value),category:$('c').value,note:$('n').value.trim()};if(q.end<=q.start){$('msg').textContent='结束时间必须晚于开始时间。';return}$('b').disabled=true;$('msg').textContent='正在同步…';try{let r=await fetch('http://127.0.0.1:8765/events',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(q)}),j=await r.json();if(!r.ok||!j.ok)throw Error(j.message||'同步失败');$('msg').textContent='✓ '+j.message;$('t').value='';$('n').value=''}catch(err){$('msg').textContent='同步失败：'+err.message}finally{$('b').disabled=false}};</script></body></html>
