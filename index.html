<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>我的工作台</title><style>:root{--bg:#f4f2ec;--paper:#fffefa;--ink:#17211d;--muted:#66716b;--green:#174c3c;--line:#dedbd2}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 system-ui,-apple-system,"Microsoft YaHei"}.wrap{max-width:1120px;margin:auto;padding:26px 18px 60px}header{display:flex;justify-content:space-between;align-items:end;gap:20px;padding:22px 0;border-bottom:1px solid var(--line)}h1{margin:0;font-size:clamp(32px,5vw,48px)}.sub{color:var(--muted);margin:5px 0 0}.nav a{color:var(--green);text-decoration:none;font-weight:750;margin-left:16px}.section{margin-top:26px}.title{display:flex;justify-content:space-between;align-items:baseline}.title h2{margin:0;font-size:23px}.title p{color:var(--muted);font-size:13px}.grid{display:grid;grid-template-columns:1.35fr .65fr;gap:16px}.card{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:0 8px 24px #15392c0d}.form{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:10px}.field{display:flex;flex-direction:column;gap:4px}.wide{grid-column:1/-1}label{font-size:12px;color:var(--muted);font-weight:750}input,select,textarea,button{padding:10px;border-radius:9px;border:1px solid #ced6cf;background:#fff;font:inherit}button{background:var(--green);color:#fff;border:0;font-weight:800;cursor:pointer}.status{min-height:22px;margin-top:10px;font-size:13px}.legend{display:grid;gap:8px}.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px}.work{background:#3b82f6}.sport{background:#22c55e}.meal{background:#f97316}.fun{background:#8b5cf6}.study{background:#eab308}.todo{margin-top:14px;padding:12px;background:#f2f7f4;border-radius:9px;font-size:13px}.daily{margin-top:16px}.daily iframe{display:block;width:100%;height:1050px;border:0;border-radius:12px;background:var(--bg)}@media(max-width:760px){header,.grid{display:block}.nav{margin-top:12px}.nav a{margin:0 12px 0 0}.grid .card{margin-bottom:14px}.form{grid-template-columns:1fr}.wide{grid-column:auto}.daily iframe{height:1250px}}</style><body><main class="wrap"><header><div><h1>我的工作台</h1><p class="sub" id="date">每天使用、持续扩展</p></div><div class="nav"><a href="#workspace">工作与记录</a><a href="#daily">今日资讯与英语</a></div></header><section id="workspace" class="section"><div class="title"><h2>工作与记录</h2><p>固定模块 · 不随日报替换</p></div><div class="grid"><section class="card"><h3>新增行动</h3><p class="sub">写下今天或未来的事项，点击后同步飞书日历。</p><form class="form" id="f"><div class="field wide"><label>事项</label><input id="t" required maxlength="80" placeholder="例如：完成项目复盘"></div><div class="field"><label>开始</label><input id="s" type="datetime-local" required></div><div class="field"><label>结束</label><input id="e" type="datetime-local" required></div><div class="field"><label>分类</label><select id="c"><option>工作</option><option>健身</option><option>吃饭</option><option>娱乐</option><option>学习</option></select></div><div class="field wide"><label>备注</label><textarea id="n" rows="2" placeholder="目标、完成标准或地点"></textarea></div><button class="wide" id="b">同步飞书日历</button></form><div class="status" id="msg" role="status"></div></section><aside class="card"><h3>你的记录系统</h3><div class="legend"><div><i class="dot work"></i>工作</div><div><i class="dot sport"></i>健身</div><div><i class="dot meal"></i>吃饭</div><div><i class="dot fun"></i>娱乐</div><div><i class="dot study"></i>学习</div></div><div class="todo"><b>下一步模块</b><br>工作记录将同步到飞书多维表格，用于统计投入时间、完成状态和每周回顾。</div></aside></div></section><section id="daily" class="section daily"><div class="title"><h2>今日资讯与英语</h2><p>每日自动更新 · 历史另存</p></div><iframe title="今日资讯、汇率与英语" src="brief.html"></iframe></section></main><script>const p=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Shanghai',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date()),v=x=>p.find(i=>i.type===x).value,d=`${v('year')}-${v('month')}-${v('day')}`,iso=x=>`${x}:00+08:00`;date.textContent=`${d} · Asia/Shanghai · 每天使用、持续扩展`;s.value=`${d}T09:00`;e.value=`${d}T09:30`;f.onsubmit=async x=>{x.preventDefault();let q={title:t.value.trim(),start:iso(s.value),end:iso(e.value),category:c.value,note:n.value.trim()};if(q.end<=q.start){msg.textContent='结束时间必须晚于开始时间。';return}b.disabled=true;msg.textContent='正在同步…';try{let r=await fetch('http://127.0.0.1:8765/events',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(q)}),j=await r.json();if(!r.ok||!j.ok)throw Error(j.message||'同步失败');msg.textContent='✓ '+j.message;t.value='';n.value=''}catch(err){msg.textContent='同步失败：'+err.message}finally{b.disabled=false}};</script></body></html>
